<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-logistica">
    <header class="encabezado">
        <div class="logistica">
            Bienvenido,<span id="nombreLogistica"></span>
        </div>
        <img src="Imagenes/logo.JPG" class="logo-principal">
    </header>
    <div class="bienvenida">
        <h1>Módulo del logistica</h1>
        <p>Desde este panel podrás gestionar tus pedidos y consultar su información</p>
    </div>
        <div class="menu-logistica">
            <a href="Logistica/Crear_codigo.html" class="btn btn-crear-codigo"><i class="bi bi-upc-scan"></i> Crear codigo</a>
            <a href="Logistica/Crear_pedido.html" class="btn btn-crear-pedido"><i class="bi bi-cart-plus"></i> Crear pedido</a>
            <a href="Logistica/Entrada_material.html" class="btn btn-entrada"><i class="bi bi-box-arrow-in-down"></i> Entrada material</a>
            <a href="Logistica/Inventario.html" class="btn btn-inventario"><i class="bi bi-box-seam"></i> Inventario</a>
            <a href="Logistica/Pedidos.html" class="btn btn-pedidos"><i class="bi bi-clipboard-check"></i> Pedidos</a>
            <a href="Clientes/Consultar_estado.html?origen=logistica" class="btn btn-consultar-estado"><i class="bi bi-search"></i> Consultar estado</a>
            <a href="Clientes/Historial.html?origen=logistica" class="btn btn-historial"><i class="bi bi-clock-history"></i> Historial</a>
            <button id="btnAdministrador" class="btn btn-administrador" style="display: none;"><i class="bi bi-arrow-left"></i> Volver</button>    
            <button class="btn btn-cerrar" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        if(usuario && usuario.area == 'admin') {
            document.getElementById('nombreLogistica').textContent =
                usuario.nombre + ' ' + usuario.apellido;
        }        
        if(usuario && usuario.area == 'admin') {
            document.getElementById('btnAdministrador').style.display = 'block';
        }
        document.getElementById('btnAdministrador').addEventListener('click', function(){
            window.location.href = 'index_administrador.html';
        });
        function cerrarSesion(){
            Swal.fire({
                title: "¿Cerrar sesión?",
                text: "Se cerrará la sesión actual.",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#198754",
                confirmButtonText: "Sí, cerrar sesión",
                cancelButtonText: "Cancelar"
            }).then((result) => {
                if(result.isConfirmed){
                    localStorage.removeItem('usuario')
                    Swal.fire({
                        title: "Sesión cerrada",
                        text: "Hasta pronto.",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });
                    setTimeout(function(){
                        window.location.href = "login.html";
                    },1500);
                }
            });
        }
    </script>
</body>
</html>
