<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h2>Pedidos</h2>
        <hr>
        <table id="pedidos-table" class="table table-bordered border-dark table-secondary">
            <thead>
                <tr>
                    <th>Número del pedido</th>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Código del producto</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="pedidos-body">
            </tbody>
        </table>
        <a href="../index_compras.html" class="btn btn-outline-primary">Volver</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
            const cuerpoTabla = document.getElementById('pedidos-body');

            fetch('http://127.0.0.1:5000/pedidos_aprobados_orden')
            .then(response => response.json())
            .then(data => {
                data.forEach(function(pedido){
                    const fila = document.createElement('tr')
                    const numeroPedido = String(pedido[0]).padStart(3, '0');
                    const codProducto = String(pedido[3]).padStart(3, '0');

                    fila.innerHTML = `
                        <td>${numeroPedido}</td>
                        <td>${pedido[1]}</td>
                        <td>${pedido[2]}</td>
                        <td>${codProducto}</td>
                        <td>${pedido[4]}</td>
                        <td>${pedido[5]}</td>
                        <td>${pedido[6]}</td>
                        <td><button type="button" class="btn btn-outline-primary btn-crear-orden" onclick="crearOrden(${pedido[0]})">Crear orden de compra</button></td>
                    `;
                    cuerpoTabla.appendChild(fila);
                });
            });
        });
        function crearOrden(idPedido){
            window.location.href = `Crear_orden_compra.html?id_pedido=${idPedido}`;
        }
    </script>
</body>
</html>
