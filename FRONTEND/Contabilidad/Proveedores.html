<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div  id="contenedorTabla"  class="contenedor mb-5">
        <h1 class="text-center mb-4">Proveedores</h1>
        <div class="tabla-contenedor">
            <table class="table table-bordered table-striped text-center">
                <thead>
                    <tr>
                        <th>Id proveedor</th>
                        <th>CC/NIT</th>
                        <th>Razón social</th>
                        <th>Nombre del asesor </th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Ciudad</th>
                        <th>País</th>
                        <th>Forma de pago</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaProveedores">
                </tbody>
            </table>
        </div>
        <a href="../index_contabilidad.html" class="btn btn-outline-primary">Volver</a>
    </div>

    <div id="formularioEditar" style="display: none;">
        <h2 class="text-center mb-4">Editar proveedor</h2>
        <form id="formEditarProveedor">
            <div class="row">
                <div class="col">
                    <label for="ID_CC_NIT" class="form-label">CC/NIT</label>
                    <input type="text" id="ID_CC_NIT" class="form-control" required>
                </div>
                <div class="col">
                    <label for="razon_social" class="form-label">Razón social</label>
                    <input type="text" id="razon_social" class="form-control" required>
                </div>
                <div class="col">
                    <label for="correo_electronico" class="form-label">Correo</label>
                    <input type="email" id="correo_electronico" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="nombre_asesor" class="form-label">Nombre del asesor</label>
                    <input type="text" id="nombre_asesor" class="form-control" required>
                </div>
                <div class="col">
                    <label for="numero_telefono" class="form-label">Teléfono</label>
                    <input type="text" id="numero_telefono" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" id="ciudad" class="form-control" required>
                </div>
                <div class="col">
                    <label for="pais" class="form-label">País</label>
                    <input type="text" id="pais" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="forma_pago" class="form-label">Forma de pago</label>
                    <input type="text" id="forma_pago" class="form-control" required>
                </div>
                <div class="col">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text" id="estado" class="form-control" readonly>
                </div>
            </div>        
            <button type="submit" class="btn btn-outline-primary">Guardar</button>
            <button type="button" class="btn btn-outline-secondary" onclick="cancelarEdicion()">Cancelar</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
            fetch('http://127.0.0.1:5000/proveedores')
            .then(response => response.json())
            .then( data => {
                console.log(data)
                const tabla = document.getElementById('tablaProveedores');
                data.forEach(proveedor => {
                    let botonEditar = '';
                    if(String(proveedor[9]).toLocaleLowerCase() !== 'rechazado'){
                        botonEditar = `
                            <button class="btn btn-outline-primary" onclick="editarProveedor(${proveedor[0]})">Editar</button>
                        `;
                    }
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${String(proveedor[0]).padStart(3, '0')}</td>
                        <td>${proveedor[1]}</td>
                        <td>${proveedor[2]}</td>
                        <td>${proveedor[3]}</td>
                        <td>${proveedor[4]}</td>
                        <td>${proveedor[5]}</td>
                        <td>${proveedor[6]}</td>
                        <td>${proveedor[7]}</td>
                        <td>${proveedor[8]}</td>
                        <td>${proveedor[9]}</td>
                        <td>${botonEditar}</td>
                    `;
                    tabla.appendChild(fila);
                });
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
        })
        let idProveedorEditar = null
        function editarProveedor(id){
            document.getElementById('contenedorTabla').style.display = 'none';
            document.getElementById('formularioEditar').style.display = 'block';

            idProveedorEditar = id;

            fetch(`http://127.0.0.1:5000/proveedor/${id}`)
            .then(response => response.json())
            .then(proveedor => {
                console.log(proveedor);

                document.getElementById('ID_CC_NIT').value = proveedor[1];
                document.getElementById('razon_social').value = proveedor[2];
                document.getElementById('nombre_asesor').value = proveedor[3];
                document.getElementById('correo_electronico').value = proveedor[4];
                document.getElementById('numero_telefono').value = proveedor[5];
                document.getElementById('ciudad').value = proveedor[6];
                document.getElementById('pais').value = proveedor[7];
                document.getElementById('forma_pago').value = proveedor[8];
                document.getElementById('estado').value = proveedor[9];
            });
        }
        function cancelarEdicion(){
            document.getElementById('formularioEditar').style.display = 'none';
            document.getElementById('contenedorTabla').style.display = 'block';
        }        
        document.getElementById('formEditarProveedor').addEventListener('submit', function(event){
            event.preventDefault();
            const datosEdita = {
                ID_CC_NIT: document.getElementById('ID_CC_NIT').value,
                razon_social: document.getElementById('razon_social').value,
                nombre_asesor: document.getElementById('nombre_asesor').value,
                correo_electronico: document.getElementById('correo_electronico').value,
                numero_telefono: document.getElementById('numero_telefono').value,
                ciudad: document.getElementById('ciudad').value,
                pais: document.getElementById('pais').value,
                forma_pago: document.getElementById('forma_pago').value,
                estado: document.getElementById('estado').value
            }
            fetch(`http://127.0.0.1:5000/actualizar_proveedor/${idProveedorEditar}`, {
                method: 'PUT',
                headers: {
                    'Content-Type' : 'application/json'
                },
                body: JSON.stringify(datosEdita)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                if(data.mensaje){
                    location.reload();
                };
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
