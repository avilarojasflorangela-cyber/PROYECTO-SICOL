<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 500px;">
            <h3 class="text-center mb-4">Modulo de Contabilidad</h3>
            <div class="d-grid gap-3">

    <a href="Contabilidad/Proveedores.html" class="btn btn-outline-secondary">Proveedores</a>
    <a href="Contabilidad/Nuevo_proveedor.html" class="btn btn-outline-info">Nuevo proveedor</a>
    <a href="Contabilidad/Factura.html" class="btn btn-outline-warning">Facturas</a>
    <a href="Contabilidad/Documentos_proveedor.html" class="btn btn-outline-secondary">Documentos de proveedores</a>
    <a href="Clientes/Consultar_estado.html?origen=contabilidad" class="btn btn-outline-primary">Consultar estado</a>
    <a href="Clientes/Historial.html?origen=contabilidad" class="btn btn-outline-success">Historial</a>
    <button id="btnAdministrador" class="btn btn-outline-dark" style="display: none;">Volver</button>    
    <button class="btn btn-danger" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </div>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        if(usuario && usuario.area == 'admin') {
            document.getElementById('btnAdministrador').style.display = 'block';
        }
        document.getElementById('btnAdministrador').addEventListener('click', function(){
            window.location.href = 'index_administrador.html';
        });
        function cerrarSesion(){
            Swal.fire({
                title: "¿Cerrar sesión?",
                text: "Se cerrará la sesión actual.",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#198754",
                confirmButtonText: "Sí, cerrar sesión",
                cancelButtonText: "Cancelar"
            }).then((result) => {
                if(result.isConfirmed){
                    localStorage.removeItem('usuario');
                    Swal.fire({
                        title: "Sesión cerrada",
                        text: "Hasta pronto.",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });
                    setTimeout(function(){
                        window.location.href = "login.html";
                    },1500);
                }
            });
        }
    </script>
</body>
</html>
