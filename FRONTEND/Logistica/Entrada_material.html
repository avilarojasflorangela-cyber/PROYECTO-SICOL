<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Entrada de Material</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-striped text-center">
                <thead>
                    <tr>
                        <th>Orden de compra</th>
                        <th>Cantidad ordenada</th>
                        <th>Cantidad recibida</th>
                        <th>Cantidad pendiente</th>
                        <th>Proveedor</th>
                        <th>Pedido</th>
                        <th>Producto</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaEntradaMaterial">
                </tbody>
            </table>
        </div>
        <div id="formularioEntrada" class="mt-4" style="display: none;">
            <h3 class="mb-3">Registrar entrada de material</h3>
            <form id="formEntradaMaterial">
                <div class="row">
                    <div class="col">
                        <label for="fecha_entrada" class="form-label">Fecha de entrada</label>
                        <input type="date" class="form-control" id="fecha_entrada" required>
                    </div>
                    <div class="col">
                        <label for="cantidad_recibida" class="form-label">Cantidad recibida</label>
                        <input type="number" class="form-control" id="cantidad_recibida" min="1" required>
                    </div>
                    <div class="col">
                        <label for="recibido_por" class="form-label">Recibido por</label>
                        <input type="text" class="form-control" id="recibido_por" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label for="observaciones" class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observaciones" rows="3"></textarea>
                    </div>
                    <div class="col">
                        <label for="id_orden" class="form-label">Orden de compra</label>
                        <input type="text" class="form-control" id="id_orden" readonly>
                    </div>
                    <div class="col">
                        <label for="cod_producto" class="form-label">Código del producto</label>
                        <input type="number" class="form-control" id="cod_producto" readonly>
                    </div>              
                </div>
                <button type="submit" class="btn btn-outline-primary">Guardar entrada</button>
                <button type="button" class="btn btn-outline-success" id="btnCancelar">Cancelar</button>
            </form>
        </div>
        <a href="../index_logistica.html" class="btn btn-outline-primary">Volver</a>
    </div>
    <script> 
        document.addEventListener('DOMContentLoaded', function(){
            fetch('http://127.0.0.1:5000/entrada_material')
            .then(response => response.json())
            .then(data => {
                console.log(data);
                const tabla = document.getElementById('tablaEntradaMaterial');
                data.forEach(entrada => {
                    const fila = document.createElement('tr');
                    const idOrden = String(entrada[0]).padStart(3, '0');
                    const idPedido = String(entrada[3]).padStart(3, '0');
                    const cantidadOrdenada = entrada[1];
                    const cantidadRecibida = parseInt(entrada[6]);
                    const cantidadPendiente = cantidadOrdenada - cantidadRecibida;
                    let estado = "";
                    if (cantidadRecibida == 0) {
                        estado = "Pendiente";
                    }else if (cantidadRecibida < cantidadOrdenada) {
                        estado = "Parcial";
                    }else{
                        estado = "Cumplida";
                    }
                    let boton ="";

                    if (cantidadRecibida < cantidadOrdenada) {
                        boton = `
                            <button class=" btn btn-outline-primary btn-registrar">Registrar entrada</button>
                        `;
                    }
                    fila.innerHTML = `
                        <td>${idOrden}</td>
                        <td>${cantidadOrdenada}</td>
                        <td>${cantidadRecibida}</td>
                        <td>${cantidadPendiente}</td>
                        <td>${entrada[2]}</td>
                        <td>${idPedido}</td>
                        <td>${entrada[5]}</td>
                        <td>${estado}</td>
                        <td>${boton}</td>
                    `;
                    const botonRegistrar = fila.querySelector('.btn-registrar');
                    if (botonRegistrar) {
                        botonRegistrar.addEventListener('click', function(){
                            const formulario = document.getElementById('formularioEntrada');
                            formulario.style.display = 'block';
                            document.getElementById('id_orden').value = String(entrada[0]).padStart(3, '0');
                            document.getElementById('cod_producto').value = entrada[4];
                        })
                    }
                    tabla.appendChild(fila);
                }); 
            })
            .catch(error => {
                console.error('Error al obtener las órdenes:', error);
            });
            const botonCancelar = document.getElementById('btnCancelar');
            botonCancelar.addEventListener('click', function(){
                const formulario = document.getElementById('formularioEntrada')
                formulario.style.display = 'none';
                document.getElementById('formEntradaMaterial').reset();
            });
            const formularioEntrada = document.getElementById('formEntradaMaterial');
            formularioEntrada.addEventListener('submit', function(event){
                event.preventDefault();

                const fechaEntrada = document.getElementById('fecha_entrada').value;
                const cantidadRecibida = document.getElementById('cantidad_recibida').value;
                const recibidoPor = document.getElementById('recibido_por').value;
                const observaciones = document.getElementById('observaciones').value;
                const idOrden = document.getElementById('id_orden').value;
                const codProducto = document.getElementById('cod_producto').value;

                fetch('http://127.0.0.1:5000/nueva_entrada_material', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({fecha_entrada: fechaEntrada, cantidad_recibida: parseInt(cantidadRecibida), recibido_por: recibidoPor, observaciones: observaciones, id_orden: parseInt(idOrden),cod_producto: parseInt(codProducto)})
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error){
                        alert(data.error);
                        return;
                    }
                    alert(data.mensaje);
                    formularioEntrada.reset();
                    document.getElementById('formularioEntrada').style.display = 'none';
                    location.reload();
                });
            });
        });
    </script>
</body>
</html>
