<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../style.css">    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="pagina-crear-pedido">
    <div class="contenedor-crear-pedido">
        <div class="encabezado-modulo">
            <h1>Crear pedido</h1>
            <p>Completa la información para registrar un nuevo pedido</p>
        </div>
        <form id="form_crear_pedido">
            <div class="row">
                <div class="col">
                    <label for="Usua_Nombre">Nombre</label>
                    <input type="text" class="form-control" id="Usua_Nombre" readonly>
                </div>
                <div class="col">
                    <label for="Usua_Apellido">Apellido</label>
                    <input type="text" class="form-control" id="Usua_Apellido" readonly>
                </div>
                <div class="col">
                    <label for="Usua_Correo">Correo</label>
                    <input type="text" class="form-control" id="Usua_Correo" readonly>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="fecha_creacion">Fecha creación</label>
                    <input type="date" class="form-control" id="fecha_creacion" required>
                </div>
                <div class="col">
                    <label for="fecha_requerida">Fecha requerida</label>
                    <input type="date" class="form-control" id="fecha_requerida" required>
                </div>
                <div class="col">
                    <label for="destino">Destino</label>
                    <input type="text" class="form-control" id="destino" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" required>
                </div>
                <div class="col">
                    <label for="cod_producto">Código del producto</label>
                    <input type="text" class="form-control" id="cod_producto" required>
                </div>
                <div class="col">
                    <label for="nombre_producto">Nombre del producto</label>
                    <input type="text" class="form-control" id="nombre_producto" readonly>
                </div>       
            </div>   
            <div class="row">
                <div class="col">
                    <label for="marca">Marca</label>
                    <input type="text" class="form-control" id="marca" readonly>
                </div>
                <div class="col">
                    <label for="descripcion">Descripción</label>
                    <input type="text" class="form-control" id="descripcion" readonly>
                </div>
            </div>
            <div class="botones-formulario">
                <button type="submit" class="btn btn-crear-pedido"><i class="bi bi-check-circle"></i> Crear pedido</button>
                <button type="button" id="btnCancelar" class="btn btn-cancelar"><i class="bi bi-x-circle"></i> Cancelar</button>
                <a href="../index_cliente.html" class="btn btn-volver"><i class="bi bi-arrow-left"></i> Volver</a>

            </div>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            const fechaCreacion = document.getElementById('fecha_creacion');
            const fechaActual = new Date();
            const año = fechaActual.getFullYear();
            const mes = String(fechaActual.getMonth() + 1).padStart(2,'0');
            const dia = String(fechaActual.getDate()).padStart(2, '0');
            const FechaFormateada = `${año}-${mes}-${dia}`;
            fechaCreacion.value = FechaFormateada;

            const usuario = JSON.parse(localStorage.getItem('usuario'));
            document.getElementById('Usua_Nombre').value = usuario.nombre;
            document.getElementById('Usua_Apellido').value = usuario.apellido;
            document.getElementById('Usua_Correo').value = usuario.correo;

            let nombreProducto = '';
            document.getElementById('cod_producto').addEventListener('change',function(){
                const codProducto = this.value;
                fetch(`http://127.0.0.1:5000/detalle_producto_codigo/${codProducto}`)
                .then(response => response.json())
                .then(data => {
                    if(data.error){
                        Swal.fire({
                            icon: 'error',
                            title: 'Producto no encontrado',
                            text: 'El código del producto no existe.'
                        });
                        document.getElementById('nombre_producto').value='';
                        document.getElementById('descripcion').value='';
                        document.getElementById('marca').value = '';
                        nombreProducto = '';
                        return;
                    }
                    document.getElementById('nombre_producto').value = data[2];
                    nombreProducto = data[2];
                    document.getElementById('descripcion').value = data[3];
                    document.getElementById('marca').value = data[8]
                });
            });
            document.getElementById('form_crear_pedido').addEventListener('submit', function(event){
                event.preventDefault();
                const usuario = JSON.parse(localStorage.getItem('usuario'));
                const fechaCreacion = document.getElementById('fecha_creacion').value;
                const fechaRequerida = document.getElementById('fecha_requerida').value;
                const destino = document.getElementById('destino').value;
                const cantidad = document.getElementById('cantidad').value;
                const codProducto = document.getElementById('cod_producto').value;

                fetch('http://127.0.0.1:5000/nuevo_crear_pedido', {
                    method:'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body:JSON.stringify({fecha_creacion: fechaCreacion, nombre_producto: nombreProducto, cantidad: cantidad, destino: destino, fecha_requerida: fechaRequerida, estado_pedido: 'Pendiente', id_usuario: usuario.id, cod_producto: codProducto})
                })
                .then(response => response.json())
                .then(data => {
                    const idPedido = String(data.id_pedido).padStart(3, '0');

                    Swal.fire({
                        icon: 'success',
                        title: 'Pedido creado',
                        text: data.mensaje + ' Número de pedido: ' + idPedido,
                        confirmButtonText: 'Aceptar'
                    });
                    
                    document.getElementById('form_crear_pedido').reset();
                    fechaCreacion.value = FechaFormateada;
                    document.getElementById('Usua_Nombre').value = usuario.nombre;
                    document.getElementById('Usua_Apellido').value = usuario.apellido;
                    document.getElementById('Usua_Correo').value = usuario.correo;  
                })
                .catch(error => {
                    console.error('Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'No se pudo crear el pedido.'
                    });
                });
            });

            const btnCancelar = document.getElementById('btnCancelar');
            btnCancelar.addEventListener('click', function(){
                Swal.fire({
                    icon: 'warning',
                    title: '¿Cancelar pedido?',
                    text: 'Se pederán los datos ingresados.',
                    showCancelButton: true,
                    confirmButtonText: 'sí, cancelar',
                    cancelButtonText: 'No, continuar'
                }).then((resultado) =>{
                    if(resultado.isConfirmed){
                        document.getElementById('form_crear_pedido').reset();
                        fechaCreacion.value = FechaFormateada;

                        document.getElementById('Usua_Nombre').value = usuario.nombre;
                        document.getElementById('Usua_Apellido').value = usuario.apellido;
                        document.getElementById('Usua_Correo').value = usuario.correo;
                    }
                });
            });
        });
    </script>    
</body>
</html>
