<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../style.css">    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="pagina-historial">
    <div class="contenedor-historial">
        <div class="encabezado-modulo">
            <h1>Historial de reportes</h1>
            <p>Descargar los reportes del sistema en formato excel</p>
        </div>
        <div class="tabla-historial">
            <table class="table">
                <thead>
                <tr>
                    <th>Reporte</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pedidos</td>
                    <td>
                        <button type="button" class="btn btn-outline-primary" id="btnDescargarPedidos">Descargar excel</button>
                    </td>
                </tr>
                <tr>
                    <td>Orden de compra</td>
                    <td>
                        <button type="button" class="btn btn-outline-primary" id="btnDescargarOrdenCompra">Descargar excel</button>
                    </td>
                </tr>
                <tr>
                    <td>Proveedores</td>
                    <td>
                        <button type="button" class="btn btn-outline-primary" id="btnDescargarProveedores">Descargar excel</button>
                    </td>
                </tr>
                <tr>
                    <td>Inventario</td>
                    <td>
                        <button type="button" class="btn btn-outline-primary" id="btnDescargarInventario">Descargar excel</button>
                    </td>
                </tr>
                <tr>
                    <td>Facturas</td>
                    <td>
                        <button type="button" class="btn btn-outline-primary" id="btnDescargarFacturas">Descargar excel</button>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div class="botones-historial">
            <button type="button" id="btnVolver" class="btn btn-volver"><i class="bi bi-arrow-left"></i> Volver</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
            const btnDescargarPedidos = document.getElementById('btnDescargarPedidos');
            const btnVolver = document.getElementById('btnVolver');

            btnVolver.addEventListener('click', function(){
                const parametros = new URLSearchParams(window.location.search);
                const origen = parametros.get('origen');

                if(origen === 'logistica'){
                    window.location.href = '../index_logistica.html';
                }else if(origen === 'cliente'){
                    window.location.href = '../index_cliente.html';
                }else if(origen === 'compras'){
                    window.location.href = '../index_compras.html';
                }else if(origen === 'contabilidad'){
                    window.location.href = '../index_contabilidad.html';
                }else if(origen === 'admin'){
                    window.location.href = '../index_administrador.html'
                }
            });
            btnDescargarPedidos.addEventListener('click', function(){
                Swal.fire({
                    icon: 'question',
                    text: '¿Desea descargar el reporte de pedidos?',
                    showCancelButton: true,
                    confirmButtonText: 'Descargar',
                    cancelButtonText: 'Cancelar'
                }).then((resultado) => {
                    if(resultado.isConfirmed){
                        window.location.href = 'http://127.0.0.1:5000/reporte_pedidos_excel';
                    }
                });
            });

            const btnDescargarOrdenCompra = document.getElementById('btnDescargarOrdenCompra');
            btnDescargarOrdenCompra.addEventListener('click', function(){
                window.location.href = 'http://127.0.0.1:5000/reporte_orden_compra_excel';
            });

            const btnDescargarProveedores = document.getElementById('btnDescargarProveedores')
            btnDescargarProveedores.addEventListener('click', function(){
                window.location.href = 'http://127.0.0.1:5000/reporte_proveedores_excel';
            });

            const btnDescargarInventario = document.getElementById('btnDescargarInventario')
            btnDescargarInventario.addEventListener('click', function(){
                window.location.href = 'http://127.0.0.1:5000/reporte_inventario_excel';
            });

            const btnDescargarFacturas = document.getElementById('btnDescargarFacturas')
            btnDescargarFacturas.addEventListener('click', function(){
                window.location.href = 'http://127.0.0.1:5000/reporte_facturas_excel';
            });
        });
    </script>
</body>
</html>
