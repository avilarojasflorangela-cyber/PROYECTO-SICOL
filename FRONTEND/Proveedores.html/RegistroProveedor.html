<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro del proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="contenedor mb-5">
        <h1 class="text-center mb-4">Registrarse</h1>
        <div class="contenedor">
            <form id="formProveedor">
            <div class="row">
                <div class="col">
                    <label for="ID_CC_NIT" class="form-label">CC/NIT</label>
                    <input type="text" id="ID_CC_NIT" class="form-control" required>
                </div>
                <div class="col">
                    <label for="razon_social" class="form-label">Razón social</label>
                    <input type="text" id="razon_social" class="form-control" required>
                </div>
                <div class="col">
                    <label for="correo_electronico" class="form-label">Correo</label>
                    <input type="email" id="correo_electronico" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="nombre_asesor" class="form-label">Nombre del asesor</label>
                    <input type="text" id="nombre_asesor" class="form-control" required>
                </div>
                <div class="col">
                    <label for="numero_telefono" class="form-label">Teléfono</label>
                    <input type="text" id="numero_telefono" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" id="ciudad" class="form-control" required>
                </div>
                <div class="col">
                    <label for="pais" class="form-label">País</label>
                    <input type="text" id="pais" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="forma_pago" class="form-label">Forma de pago</label>
                    <select id="forma_pago" class="form-select" required>
                        <option value="">Seleccione una forma de pago</option>
                        <option value="PSE">PSE</option>

                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-outline-secondary">Guardar</button>
            </form>
        </div>
        <a href="../index_proveedores.html" class="btn btn-outline-primary">Volver</a>
    </div>

    <script>
        document.getElementById('formProveedor').addEventListener('submit', function(event){
            event.preventDefault();
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            const proveedor = {
                ID_CC_NIT: document.getElementById('ID_CC_NIT').value,
                razon_social: document.getElementById('razon_social').value,
                correo_electronico: document.getElementById('correo_electronico').value,
                nombre_asesor: document.getElementById('nombre_asesor').value,
                numero_telefono: document.getElementById('numero_telefono').value,
                ciudad: document.getElementById('ciudad').value,
                pais: document.getElementById('pais').value,
                forma_pago: document.getElementById('forma_pago').value,
                id_usuario: usuario.id
            };
            fetch('http://127.0.0.1:5000/nuevo_proveedor',{
                method: 'POST',
                headers: {
                    'Content-Type' : 'application/json'
                },
                body: JSON.stringify(proveedor)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data)
                if(data.mensaje) {
                    alert(data.mensaje);
                    document.getElementById('formProveedor').reset();
                }
            })
            .catch(error => console.error('Error:', error));
        })
    </script>
</body>
</html>
