<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div  id="contenedorTabla"  class="contenedor mb-5">
        <h1 class="text-center mb-4">Estado del proveedor</h1>
        <div class="tabla-contenedor">
            <table class="table table-bordered table-striped text-center">
                <thead>
                    <tr>
                        <th>Id proveedor</th>
                        <th>CC/NIT</th>
                        <th>Razón social</th>
                        <th>Nombre del asesor </th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Ciudad</th>
                        <th>País</th>
                        <th>Forma de pago</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaProveedores">
                </tbody>
            </table>
        </div>
        <a href="../index_proveedores.html" class="btn btn-outline-primary">Volver</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            console.log(usuario);

            fetch('http://127.0.0.1:5000/proveedores')
            .then(response => response.json())
            .then(data => {
                const proveedor = data.find(
                    proveedor => proveedor[10] == usuario.id
                );
                console.log(proveedor);
                const tabla = document.getElementById('tablaProveedores');
                const fila = document.createElement('tr')

                fila.innerHTML = `
                    <td>${String(proveedor[0]).padStart(3, '0')}</td>
                    <td>${proveedor[1]}</td>
                    <td>${proveedor[2]}</td>
                    <td>${proveedor[3]}</td>
                    <td>${proveedor[4]}</td>
                    <td>${proveedor[5]}</td>
                    <td>${proveedor[6]}</td>
                    <td>${proveedor[7]}</td>
                    <td>${proveedor[8]}</td>
                    <td>${proveedor[9]}</td>
                `;
                tabla.appendChild(fila);
            })
            .catch(error => console.error('Error:', error));
        })
    </script>
